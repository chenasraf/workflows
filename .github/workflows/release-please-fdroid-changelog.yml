# Reusable Release Please + F-Droid Changelog Workflow
#
# Runs release-please, then, when the release PR was created or updated,
# copies the curated release notes for the PR's version into the changelog
# path F-Droid reads (`<changelog-dir>/<versionCode>.txt`) and amends it into
# the release commit. F-Droid builds from the tagged source, so the file has
# to be in the tree at the tag; the other stores get their notes uploaded
# from `release-notes/<version>/` at deploy time.
#
# When the notes for the version don't exist yet, nothing is copied: the
# release-notes check fails on the PR until they land on the default branch,
# and release-please re-runs (and this step with it) on that push.
#
# Outputs are forwarded from release-please so downstream jobs can
# use release_created, tag_name, and version.

name: Release Please + F-Droid Changelog

on:
  workflow_call:
    inputs:
      release-type:
        description: 'Release Please release type (e.g., dart, node, python, go)'
        required: true
        type: string
      version-file:
        description: 'pubspec-style file holding `version: <name>+<code>`'
        required: false
        type: string
        default: 'pubspec.yaml'
      notes-file:
        description: 'Curated notes to copy; `{version}` is replaced with the version name'
        required: false
        type: string
        default: 'release-notes/{version}/play.txt'
      changelog-dir:
        description: 'Directory F-Droid reads changelogs from'
        required: false
        type: string
        default: 'fastlane/metadata/android/en-US/changelogs'
    secrets:
      token:
        description: 'GitHub token for release-please (defaults to GITHUB_TOKEN)'
        required: false
    outputs:
      release_created:
        description: 'Whether a release was created'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: 'The release tag name'
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: 'The release version'
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ secrets.token || github.token }}

      - name: Copy release notes into the F-Droid changelog
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
          VERSION_FILE: ${{ inputs.version-file }}
          NOTES_FILE: ${{ inputs.notes-file }}
          CHANGELOG_DIR: ${{ inputs.changelog-dir }}
        run: |
          set -euo pipefail
          PR_BRANCH=$(echo "$PR_JSON" | jq -r .headBranchName)
          git clone --depth=5 --branch "$PR_BRANCH" \
            https://x-access-token:${{ secrets.token || github.token }}@github.com/${{ github.repository }}.git _pr
          cd _pr

          VERSION_LINE=$(grep '^version:' "$VERSION_FILE")
          VERSION=$(echo "$VERSION_LINE" | sed 's/version: *//;s/+.*//')
          CODE=$(echo "$VERSION_LINE" | sed 's/.*+//')

          SOURCE="${NOTES_FILE//\{version\}/$VERSION}"
          if [ ! -f "$SOURCE" ]; then
            echo "No $SOURCE yet — leaving the F-Droid changelog alone."
            exit 0
          fi

          mkdir -p "$CHANGELOG_DIR"
          cp "$SOURCE" "$CHANGELOG_DIR/$CODE.txt"
          echo "Copied $SOURCE → $CHANGELOG_DIR/$CODE.txt"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CHANGELOG_DIR"
          if git diff --cached --quiet; then
            echo "No changelog changes."
          else
            git commit --amend --no-edit
            git push --force-with-lease
          fi
